<!DOCTYPE html>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background-image:url('background.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
min-height:100vh;
padding:20px;
text-align:center;
}

.logo{
width:140px;
height:140px;
border-radius:50%;
background:#fff;
padding:10px;
margin:20px auto;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.25);
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
}

h1{
color:#fff;
font-size:34px;
margin-bottom:5px;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}

.subtitle{
color:#fff;
margin-bottom:30px;
font-size:18px;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}

.links{
max-width:500px;
margin:auto;
}

.btn{
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(255,255,255,0.75);
color:#222;
text-decoration:none;
padding:18px 20px;
border-radius:15px;
margin-bottom:15px;
font-size:20px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.20);
backdrop-filter:blur(4px);
}

.btn span{
flex:1;
text-align:center;
}

.btn i{
font-size:28px;
width:35px;
}

.icon-img{
width:32px;
height:32px;
object-fit:contain;
}

.phone{color:#2d7cff;}
.whatsapp{color:#25D366;}
.facebook{color:#1877F2;}

.footer{
margin-top:30px;
color:#fff;
font-size:14px;
font-weight:bold;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<div class="logo">
