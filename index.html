<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الورشة | Alwarsha</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#000;
color:#fff;
display:flex;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:430px;
}

.card{
background:#111;
border-radius:25px;
padding:25px;
text-align:center;
border:1px solid #222;
box-shadow:0 0 25px rgba(255,255,255,.05);
}

.profile{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #FFD700;
}

h1{
margin-top:15px;
font-size:28px;
}

.desc{
color:#bbb;
margin-top:8px;
font-size:15px;
}

.contact-btn{
display:inline-block;
background:#FFD700;
color:#000;
padding:12px 25px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
margin-top:18px;
}

.socials{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:25px;
}

.social{
background:#1b1b1b;
padding:15px;
border-radius:15px;
text-decoration:none;
color:white;
font-size:14px;
transition:.3s;
}

.social:hover{
transform:translateY(-3px);
}

.social i{
display:block;
font-size:24px;
margin-bottom:8px;
}

.footer{
text-align:center;
margin-top:20px;
color:#666;
font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<img src="profile.jpg" class="profile">

<h1>الورشة</h1>

<p class="desc">
خدمات QR & NFC والحفر والاكريليك
</p>

<a class="contact-btn" href="contact.vcf">
حفظ جهة الاتصال
</a>

<div class="socials">

<a class="social" href="tel:01095195829">
<i class="fa-solid fa-phone"></i>
اتصال
</a>

<a class="social" href="https://wa.me/201095195829">
<i class="fab fa-whatsapp"></i>
واتساب
</a>

<a class="social" href="#">
<i class="fab fa-facebook-f"></i>
فيسبوك
</a>

<a class="social" href="#">
<i class="fab fa-instagram"></i>
انستجرام
</a>

<a class="social" href="#">
<i class="fab fa-tiktok"></i>
تيك توك
</a>

<a class="social" href="#">
<i class="fab fa-linkedin"></i>
لينكدإن
</a>

</div>

</div>

<div class="footer">
© Alwarsha
</div>

</div>

</body>
</html>
